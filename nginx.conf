events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    
    server {
        listen 80;
        server_name meuapp.local;
        return 301 https://$server_name$request_uri;
    }

   
    server {
        listen 443 ssl http2;
        server_name meuapp.local;

        ssl_certificate     /etc/nginx/certs/meuapp.local.pem;
        ssl_certificate_key /etc/nginx/certs/meuapp.local-key.pem;

       
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https:; connect-src 'self' https:; script-src 'self' 'unsafe-inline' https:; font-src 'self' data:; img-src 'self' data:; frame-src 'self' https:;" always;
        add_header Referrer-Policy "no-referrer" always;

        
        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        
        location /api/ {
            proxy_pass http://backend:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}